[theme]
base = "light"
primaryColor = "#176B68"
backgroundColor = "#F7F5EF"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#17252A"
font = "sans serif"

[server]
maxUploadSize = 100
headless = true

[browser]
gatherUsageStats = false

[client]
# MiniDataDev uses its own product navigation in app.py. The files in pages/
# are render modules, not independent Streamlit entry points.
showSidebarNavigation = false
